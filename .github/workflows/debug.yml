name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
      - feature/arcade-mode
      - Daijishou-Backup
  pull_request:
    branches:
      - main
      - master
      - feature/arcade-mode
  workflow_dispatch:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build & Package Debug APK (v1.8.1)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        run: |
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { "C:\Android\android-sdk" }
          $sdkmanager = Join-Path $sdk "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkmanager)) {
            $sdkmanager = (Get-ChildItem -Path (Join-Path $sdk "cmdline-tools") -Filter "sdkmanager.bat" -Recurse | Select-Object -First 1).FullName
          }
          if ($sdkmanager -and (Test-Path $sdkmanager)) {
            Write-Host "Ensuring Android SDK 35 and Build-Tools 35.0.0..."
            & $sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          }

      - name: Execute Full Build Pipeline (Apktool 3.0.3)
        run: |
          powershell -ExecutionPolicy Bypass -File build_app_v181.ps1 -OutApk "Daijishou-v1.8.1-debug.apk"

      - name: Package Debug Artifact (ZIP with Commit Number)
        id: package
        run: |
          $commitNum = git rev-list --count HEAD
          $shortSha  = git rev-parse --short HEAD
          $stageDir  = "build_out_debug"
          New-Item -ItemType Directory -Force $stageDir | Out-Null

          $apkSrc  = "Daijishou-v1.8.1-debug.apk"
          $apkName = "Daijishou-1.8.1-debug-c${commitNum}-${shortSha}.apk"
          Copy-Item $apkSrc (Join-Path $stageDir $apkName) -Force

          $hash = (Get-FileHash -Path $apkSrc -Algorithm SHA256).Hash
          $buildInfo = @"
          ==================================================
          Daijishou 1.8.1 Reconstructed Build (Debug)
          ==================================================
          Version Code  : 426
          Version Name  : 1.8.1
          Commit Number : $commitNum
          Commit SHA    : $shortSha
          Full SHA      : $($env:GITHUB_SHA)
          Branch/Ref    : $($env:GITHUB_REF_NAME)
          minSdkVersion : 24 (Android 7.0+)
          targetSdk     : 35 (Android 15)
          Signatures    : v1 (JAR), v2, v3
          APK Output    : $apkName
          APK Size      : $((Get-Item $apkSrc).Length) bytes
          SHA256 Checksum:
          $hash  $apkName
          Build Date    : $((Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss")) UTC
          Pipeline Mode : Apktool 3.0.3 + Custom Modular Patches
          Features      : Battery Percentage Fix, Background Music (roms/music/), Full Storage Permissions
          ==================================================
          "@
          Set-Content -Path (Join-Path $stageDir "BUILD_INFO.txt") -Value $buildInfo

          $zipName = "Daijishou-Debug-c${commitNum}-${shortSha}.zip"
          Compress-Archive -Path "$stageDir\*" -DestinationPath $zipName -Force

          Write-Host "Created ZIP: $zipName"
          echo "commit_num=$commitNum" >> $env:GITHUB_OUTPUT
          echo "short_sha=$shortSha" >> $env:GITHUB_OUTPUT
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload Debug ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_name }}
          retention-days: 30
