name: Build Release APK

on:
  push:
    branches:
      - master
      - Daijishou-Backup
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.8.1-r1)'
        required: false
        default: ''
      create_github_release:
        description: 'Create GitHub Release entry'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build & Package Release APK (v1.8.1)
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        run: |
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { "C:\Android\android-sdk" }
          $sdkmanager = Join-Path $sdk "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkmanager)) {
            $sdkmanager = (Get-ChildItem -Path (Join-Path $sdk "cmdline-tools") -Filter "sdkmanager.bat" -Recurse | Select-Object -First 1).FullName
          }
          if ($sdkmanager -and (Test-Path $sdkmanager)) {
            Write-Host "Ensuring Android SDK 35 and Build-Tools 35.0.0..."
            & $sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          }

      - name: Execute Full Build Pipeline (Apktool 3.0.3)
        run: |
          powershell -ExecutionPolicy Bypass -File build_app_v181.ps1 -OutApk "Daijishou-v1.8.1-release.apk"

      - name: Package Release Artifact (ZIP with Commit Number)
        id: package
        run: |
          $commitNum = git rev-list --count HEAD
          $shortSha  = git rev-parse --short HEAD
          $stageDir  = "build_out_release"
          New-Item -ItemType Directory -Force $stageDir | Out-Null

          $apkSrc  = "Daijishou-v1.8.1-release.apk"
          $apkName = "Daijishou-1.8.1-release-c${commitNum}-${shortSha}.apk"
          Copy-Item $apkSrc (Join-Path $stageDir $apkName) -Force

          $hash = (Get-FileHash -Path $apkSrc -Algorithm SHA256).Hash
          Set-Content -Path (Join-Path $stageDir "SHA256SUMS.txt") -Value "$hash  $apkName"

          $releaseNotes = @"
          # Daijishou 1.8.1 Reconstructed — Release

          - **Version Code**: 426
          - **Version Name**: 1.8.1
          - **Commit Number**: $commitNum
          - **Commit SHA**: $shortSha (`$($env:GITHUB_SHA)`)
          - **Branch / Tag**: $($env:GITHUB_REF_NAME)
          - **Compatibility**: minSdkVersion 24 (Android 7.0+) até targetSdk 35 (Android 15)
          - **Signatures**: v1 (JAR), v2, v3
          - **APK SHA256**: \`$hash\`
          - **File Size**: $((Get-Item $apkSrc).Length) bytes

          ### Melhorias Inclusas:
          1. **Base 1.8.1 Completa**: Modo de Resgate (RescueActivity), suporte moderno a Android 14/15 e 6 módulos DEX.
          2. **Correção de Bateria**: Cálculo real proporcional e carregamento instantâneo via sticky broadcast (adeus 0% fixo).
          3. **Motor de Músicas de Fundo**: Varredura automática na pasta \`roms/music/\`, \`ROMs/music/\` e MediaStore com fila aleatória (shuffle).
          4. **Interface e Ícone ♪**: Opção nas preferências com ícone de nota musical ♪ e início imediato de nova faixa ao religar (sem silêncio).
          5. **Traduções**: 100% traduzido para Português do Brasil e mais 12 idiomas.
          6. **Permissões**: Suporte total a armazenamento compartilhado (\`MANAGE_EXTERNAL_STORAGE\` e \`READ_MEDIA_AUDIO\`).
          "@
          Set-Content -Path (Join-Path $stageDir "RELEASE_NOTES.md") -Value $releaseNotes

          $zipName = "Daijishou-Release-c${commitNum}-${shortSha}.zip"
          Compress-Archive -Path "$stageDir\*" -DestinationPath $zipName -Force

          Write-Host "Created Release ZIP: $zipName"
          echo "commit_num=$commitNum" >> $env:GITHUB_OUTPUT
          echo "short_sha=$shortSha" >> $env:GITHUB_OUTPUT
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          echo "apk_name=$apkName" >> $env:GITHUB_OUTPUT
          echo "apk_path=$stageDir\$apkName" >> $env:GITHUB_OUTPUT
          echo "release_notes_path=$stageDir\RELEASE_NOTES.md" >> $env:GITHUB_OUTPUT

      - name: Upload Release ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_name }}
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_github_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: Daijishou 1.8.1 Reconstructed (c${{ steps.package.outputs.commit_num }}-${{ steps.package.outputs.short_sha }})
          body_path: ${{ steps.package.outputs.release_notes_path }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.package.outputs.zip_name }}
            ${{ steps.package.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
